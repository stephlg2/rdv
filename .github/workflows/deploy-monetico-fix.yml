name: Deploy Monetico fix
on:
  workflow_dispatch:
  push:
    branches: [cursor/monetico-migration-conformite-659d]
    paths:
      - 'wp-content/plugins/devis-pro/**'
      - '.github/workflows/deploy-monetico-fix.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Health + optional deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 146.59.144.202
          username: debian
          port: 4747
          password: ${{ secrets.RDV_VPS_PASSWORD }}
          timeout: 45s
          script: |
            set +e
            echo "=== HOST ==="
            hostname; uptime; free -h | head -2; df -h / | tail -1
            echo "=== SERVICES ==="
            systemctl is-active nginx php8.0-fpm mysql
            echo "=== LOCAL HTTP ==="
            curl -sI --max-time 8 -o /dev/null -w "loopback=%{http_code} t=%{time_total}\n" -H 'Host: www.rdvasie.com' http://127.0.0.1/
            curl -sI --max-time 8 -o /dev/null -w "public=%{http_code} t=%{time_total}\n" https://www.rdvasie.com/
            echo "=== NGINX ERR ==="
            sudo tail -15 /var/log/nginx/error.log
            echo "=== LOAD ==="
            cat /proc/loadavg
            echo "=== OOM ==="
            sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -5 || echo none
